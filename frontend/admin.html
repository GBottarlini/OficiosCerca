<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OficiosCerca · Admin</title>
  <style>
    :root { --bg:#0b0e11; --panel:#12161c; --muted:#8b95a7; --text:#e8edf3; --accent:#ff7a19; --line:#202531; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial; background:var(--bg); color:var(--text); }
    .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
    h1 { margin:0 0 12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .grid { display:grid; gap:16px; grid-template-columns: 1fr; }
    .row { display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
    input, button { padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0e1218; color:var(--text); }
    button.primary { background:var(--accent); color:#111; border:none; font-weight:700; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid var(--line); vertical-align: top; }
    .muted { color:var(--muted); }
    .tag { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:999px; font-size:12px; margin-right:6px; color:#cbd5e1; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin:16px 0; gap: 8px; flex-wrap: wrap; }
    .hidden { display:none; }
    .tabs button { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OficiosCerca · Admin</h1>

    <section id="loginCard" class="card">
      <h2>Iniciar sesión</h2>
      <div class="grid">
        <label class="row">Email <input id="email" type="email" placeholder="admin@oficioscerca.local" /></label>
        <label class="row">Contraseña <input id="password" type="password" placeholder="Admin123!" /></label>
        <div class="row">
          <button id="loginBtn" class="primary">Entrar</button>
          <span id="loginMsg" class="muted"></span>
        </div>
      </div>
    </section>

    <section id="panelCard" class="card hidden">
      <div class="toolbar">
        <div class="tabs">
          <button id="tabPending" class="primary">Pendientes</button>
          <button id="tabApproved">Aprobados</button>
        </div>
        <div class="row">
          <span id="who" class="muted"></span>
          <button id="logoutBtn">Salir</button>
        </div>
      </div>

      <div id="emptyMsg" class="muted" style="display:none;">No hay resultados.</div>
      <table id="tbl" class="hidden">
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Categoría</th><th>Ciudad</th><th>Tags</th><th>Teléfono</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
